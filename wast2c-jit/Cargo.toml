[package]
name = "wast2c-jit"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "wast2c-jit"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
rayon = "1.12.0"
walkdir = "2.5.0"
wasm2c = { path = ".." }

[build-dependencies]
cc = "1.9.0"
