[package]
name = "test-runner"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "test-runner"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
convert_case = "0.12.0"
walkdir = "2.5.0"
wasm2c = { path = ".." }
wast = "262.0.0"

[build-dependencies]
cc = "1.9.0"
