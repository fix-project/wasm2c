[package]
name = "test-runner"
version = "0.1.0"
edition = "2024"
publish = false
default-run = "test-runner"

[dependencies]
anyhow = "1.0.103"
buffer-redux = "1.1.0"
clap = { version = "4.6.4", features = ["derive"] }
clio = { version = "0.3.5", features = ["clap-parse"] }
convert_case = "0.11.0"
wasm2c = { path = ".." }
wast = "255.0.0"

[build-dependencies]
cc = "1.5.1"
