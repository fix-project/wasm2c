name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
      - name: Check formatting
        run: cargo +stable fmt --all -- --check
  
  clippy:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add clippy --toolchain stable
      - name: Run clippy
        run: cargo +stable clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - name: Build wasm2c
        run: cargo +stable build --locked
      - name: Test wasm2c
        run: cargo +stable test --locked

  execution:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - name: Install LLVM 22
        run: |
          curl --fail --silent --show-error --location \
            https://apt.llvm.org/llvm.sh -o llvm.sh
          sudo bash llvm.sh 22
          sudo apt-get install -y \
            build-essential llvm-22-dev \
            libclang-22-dev libclang-cpp22-dev
          echo "$(llvm-config-22 --bindir)" >> "$GITHUB_PATH"
      - name: Run execution test
        run: cargo +stable test --locked -p test-runner --lib -- --nocapture
