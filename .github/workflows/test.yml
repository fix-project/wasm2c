name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
      - name: Install clang-format 22
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-format-22
      - name: Check formatting
        run: |
          cargo fmt --all -- --check
          clang-format-22 -i ./wast2c-jit/src/jit.cc
          git diff --exit-code
  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add clippy --toolchain stable
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            llvm-22 \
            llvm-22-dev \
            clang-22 \
            libclang-22-dev \
            libclang-cpp22-dev \
            clang-tidy-22
      - name: Run clippy
        run: |
          cargo clippy --locked --all -- -D warnings
          clang-tidy-22 -p target ./wast2c-jit/src/jit.cc

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Install Rust
        run: rustup update stable
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            llvm-22 \
            llvm-22-dev \
            clang-22 \
            libclang-22-dev \
            libclang-cpp22-dev
      - name: Build wasm2c
        run: RUSTFLAGS="-Dwarnings" cargo build --locked --all
      - name: Test wasm2c
        run: RUSTFLAGS="-Dwarnings" cargo test --locked --all -- --no-capture
      - name: Run wast tests
        run: |
          RUSTFLAGS="-Dwarnings" cargo run --locked -p wast2c-jit tests/* | tee tests/expected.txt
          git diff --exit-code -- tests/expected.txt
