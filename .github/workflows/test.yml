name: Test

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add rustfmt --toolchain stable
      - name: Check formatting
        run: cargo fmt --all -- --check
  
  clippy:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          rustup update stable
          rustup component add clippy --toolchain stable
      - name: Run clippy
        run: cargo clippy --locked --all-targets -- -D warnings

  build:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: rustup update stable
      - name: Install LLVM 22
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            llvm-22 \
            llvm-22-dev \
            clang-22 \
            libclang-22-dev \
            libclang-cpp22-dev
      - name: Build wasm2c
        run: RUSTFLAGS="-Dwarnings" cargo build --locked --all
      - name: Test wasm2c
        run: RUSTFLAGS="-Dwarnings" cargo test --locked --all -- --no-capture
      - name: Test wast
        run: RUSTFLAGS="-Dwarnings" cargo run --locked -p test-runner | tee "$RUNNER_TEMP/wast-proposed.txt"
      - uses: actions/checkout@v6
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .ci-base
      - name: Check wast regressions
        if: github.event_name == 'pull_request'
        working-directory: .ci-base
        run: |
          cargo run --locked -p test-runner | tee "$RUNNER_TEMP/wast-base.txt"

          cd "$RUNNER_TEMP"
          sed -n 's/ pass$//p' wast-base.txt | sort -u > wast-base-passes.txt
          sed -n 's/ pass$//p' wast-proposed.txt | sort -u > wast-proposed-passes.txt

          comm -23 wast-base-passes.txt wast-proposed-passes.txt > wast-regressions.txt
          if [[ -s wast-regressions.txt ]]; then
            cat wast-regressions.txt
            exit 1
          fi
